openapi: 3.0.4
info:
  title: Forma Zieleni Core API
  version: 1.0.0
  description: Canonical API contract for Auth, CRM, Sales, Capacity, Projects, Offers, Payments, Files, Events and Automation.
    OpenAPI 3.0.x by explicit project decision.
servers:
- url: https://api.formazieleni.pl/v1
  description: production via Cloudflare only
- url: https://staging-api.formazieleni.pl/v1
  description: staging
tags:
- name: System
- name: Auth
- name: CRM
- name: Sales
- name: Capacity
- name: Projects
- name: Offers
- name: Payments
- name: Files
- name: Events
- name: Automation
paths:
  /health:
    get:
      tags:
      - System
      operationId: health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  version:
                    type: string
  /auth/magic-link:
    post:
      tags:
      - Auth
      operationId: requestMagicLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Accepted
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/verify:
    post:
      tags:
      - Auth
      operationId: verifyMagicLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - user
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
      - Auth
      operationId: getMe
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Logged out

      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /offers/{id}/accept:
    post:
      tags:
      - Offers
      operationId: acceptOffer
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '409':
          $ref: '#/components/responses/Conflict'
  /files/upload-intents:
    post:
      tags:
      - Files
      operationId: createUploadIntent
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - filename
              - content_type
              - size_bytes
              properties:
                filename:
                  type: string
                content_type:
                  type: string
                size_bytes:
                  type: integer
                project_id:
                  type: string
                kind:
                  type: string
                visibility:
                  type: string
      responses:
        '201':
          description: Private upload intent
          content:
            application/json:
              schema:
                type: object
                required:
                - asset_id
                - upload_url
                - expires_at
                properties:
                  asset_id:
                    type: string
                  upload_url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
  /webhooks/{provider}:
    post:
      tags:
      - Automation
      operationId: receiveWebhook
      security: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      - name: X-Webhook-Signature
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Accepted; replay-safe and idempotent
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: BadRequest
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NotFound
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: TooManyRequests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      required:
      - limit
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type: string
          nullable: true
    User:
      type: object
      required:
      - id
      - email
      - role
      - created_at
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - admin
          - designer
          - client
          - partner
          - service
        created_at:
          type: string
          format: date-time
    Lead:
      type: object
      required:
      - id
      - source
      - status
      - name
      - phone
      - created_at
      properties:
        id:
          type: string
        source:
          type: string
        status:
          type: string
          enum:
          - new
          - contacted
          - qualified
          - consultation
          - offer
          - won
          - lost
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        location:
          type: string
          nullable: true
        project_type:
          type: string
        budget_min_pln:
          type: integer
          nullable: true
        budget_max_pln:
          type: integer
          nullable: true
        next_action_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    Opportunity:
      type: object
      required:
      - id
      - lead_id
      - stage
      - created_at
      properties:
        id:
          type: string
        lead_id:
          type: string
        stage:
          type: string
          enum:
          - qualification
          - consultation
          - proposal
          - negotiation
          - won
          - lost
        estimated_value_pln:
          type: integer
          nullable: true
        estimated_hours:
          type: number
          nullable: true
        probability_pct:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        next_action:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    CapacitySlot:
      type: object
      required:
      - id
      - starts_on
      - ends_on
      - capacity_hours
      - reserved_hours
      properties:
        id:
          type: string
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        capacity_hours:
          type: number
        reserved_hours:
          type: number
        notes:
          type: string
          nullable: true
    Project:
      type: object
      required:
      - id
      - client_user_id
      - name
      - status
      - created_at
      properties:
        id:
          type: string
        client_user_id:
          type: string
        lead_id:
          type: string
          nullable: true
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
          - planned
          - active
          - waiting_client
          - on_hold
          - completed
          - cancelled
        location:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Offer:
      type: object
      required:
      - id
      - lead_id
      - status
      - currency
      - total_gross
      - created_at
      properties:
        id:
          type: string
        lead_id:
          type: string
        project_id:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - draft
          - sent
          - viewed
          - accepted
          - rejected
          - expired
        currency:
          type: string
          example: PLN
        total_gross:
          type: integer
          description: minor units (grosze)
        valid_until:
          type: string
          format: date
          nullable: true
        accepted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    Payment:
      type: object
      required:
      - id
      - status
      - amount
      - currency
      - created_at
      properties:
        id:
          type: string
        offer_id:
          type: string
          nullable: true
        project_id:
          type: string
          nullable: true
        provider:
          type: string
        provider_ref:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - pending
          - paid
          - failed
          - refunded
          - cancelled
        amount:
          type: integer
        currency:
          type: string
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    FileAsset:
      type: object
      required:
      - id
      - filename
      - kind
      - visibility
      - created_at
      properties:
        id:
          type: string
        project_id:
          type: string
          nullable: true
        lead_id:
          type: string
          nullable: true
        filename:
          type: string
        kind:
          type: string
        visibility:
          type: string
          enum:
          - internal
          - client
          - partner
        content_type:
          type: string
        size_bytes:
          type: integer
        checksum_sha256:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    DomainEvent:
      type: object
      required:
      - id
      - name
      - aggregate_type
      - aggregate_id
      - occurred_at
      properties:
        id:
          type: string
        name:
          type: string
        aggregate_type:
          type: string
        aggregate_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
    AutomationRule:
      type: object
      required:
      - id
      - name
      - event_name
      - enabled
      properties:
        id:
          type: string
        name:
          type: string
        event_name:
          type: string
        enabled:
          type: boolean
        conditions:
          type: object
          additionalProperties: true
        actions:
          type: array
          items:
            type: object
            additionalProperties: true
